name: JobTracker CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run OxLint
        run: npm run lint

      - name: Run TypeScript Compiler Check
        run: npx tsc -b

  integration-tests:
    name: Automated Integration Tests
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Wait for MongoDB to be ready
        run: |
          until mongosh --eval "db.runCommand({ ping: 1 })" --quiet; do
            echo "Waiting for MongoDB..."
            sleep 2
          done

      - name: Run All Integration Test Suites
        env:
          PORT: 5000
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/jobtracker_test
          SESSION_SECRET: test_session_secret_32_bytes_super_secure
        run: npm run test:all

  build-and-docker-sanity:
    name: Production Build & Docker Sanity
    needs: integration-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Run Production Client Build
        run: npm run build

      - name: Build Docker Container Image
        run: docker build -t jobtracker:latest .
